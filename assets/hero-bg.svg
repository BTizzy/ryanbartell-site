<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="vxHeroBgGrad" cx="38%" cy="42%" r="78%">
      <stop offset="0%" stop-color="#0f1828" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#0c1018" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vxHeroTopShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </linearGradient>
    <filter id="vxHeroGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>

  <!-- Base radial gradient (deep navy → near-black) -->
  <rect width="1600" height="900" fill="url(#vxHeroBgGrad)"/>

  <!-- Top vignette shade for header contrast -->
  <rect width="1600" height="240" fill="url(#vxHeroTopShade)"/>

  <!-- Subtle structural grid (very faint horizontal/vertical reference lines) -->
  <g stroke="#1a2a3a" stroke-width="0.5" opacity="0.18">
    <line x1="0" y1="180" x2="1600" y2="180"/>
    <line x1="0" y1="360" x2="1600" y2="360"/>
    <line x1="0" y1="540" x2="1600" y2="540"/>
    <line x1="0" y1="720" x2="1600" y2="720"/>
    <line x1="320" y1="0" x2="320" y2="900"/>
    <line x1="640" y1="0" x2="640" y2="900"/>
    <line x1="960" y1="0" x2="960" y2="900"/>
    <line x1="1280" y1="0" x2="1280" y2="900"/>
  </g>

  <!-- Connection lines (low opacity accent — primary network) -->
  <g stroke="#00ff88" stroke-width="0.7" opacity="0.09" fill="none" stroke-linecap="round">
    <line x1="180" y1="220" x2="420" y2="340"/>
    <line x1="420" y1="340" x2="680" y2="180"/>
    <line x1="680" y1="180" x2="940" y2="280"/>
    <line x1="940" y1="280" x2="1200" y2="160"/>
    <line x1="1200" y1="160" x2="1380" y2="320"/>
    <line x1="220" y1="540" x2="500" y2="660"/>
    <line x1="500" y1="660" x2="780" y2="500"/>
    <line x1="780" y1="500" x2="1080" y2="640"/>
    <line x1="1080" y1="640" x2="1320" y2="540"/>
    <line x1="320" y1="780" x2="640" y2="700"/>
    <line x1="640" y1="700" x2="900" y2="780"/>
    <line x1="900" y1="780" x2="1180" y2="720"/>
    <line x1="420" y1="340" x2="500" y2="660"/>
    <line x1="680" y1="180" x2="780" y2="500"/>
    <line x1="940" y1="280" x2="1080" y2="640"/>
    <line x1="1200" y1="160" x2="1180" y2="720"/>
    <line x1="100" y1="350" x2="180" y2="220"/>
    <line x1="1380" y1="320" x2="1480" y2="200"/>
    <line x1="220" y1="540" x2="120" y2="700"/>
    <line x1="1320" y1="540" x2="1450" y2="680"/>
    <line x1="320" y1="780" x2="200" y2="820"/>
    <line x1="1480" y1="200" x2="1500" y2="450"/>
    <line x1="80" y1="120" x2="180" y2="220"/>
    <line x1="1180" y1="720" x2="1450" y2="680"/>
  </g>

  <!-- Secondary network (dimmer, shorter edges) -->
  <g stroke="#00ff88" stroke-width="0.5" opacity="0.05" fill="none">
    <line x1="80" y1="120" x2="280" y2="80"/>
    <line x1="540" y1="120" x2="820" y2="60"/>
    <line x1="1080" y1="100" x2="1300" y2="60"/>
    <line x1="60" y1="380" x2="100" y2="350"/>
    <line x1="60" y1="620" x2="220" y2="540"/>
    <line x1="100" y1="850" x2="320" y2="780"/>
    <line x1="700" y1="830" x2="900" y2="780"/>
    <line x1="1450" y1="450" x2="1500" y2="450"/>
    <line x1="1520" y1="700" x2="1450" y2="680"/>
    <line x1="1500" y1="820" x2="1180" y2="720"/>
  </g>

  <!-- Network nodes (primary dim dots) -->
  <g fill="#00ff88" opacity="0.22">
    <circle cx="180" cy="220" r="2"/>
    <circle cx="420" cy="340" r="2"/>
    <circle cx="680" cy="180" r="2"/>
    <circle cx="940" cy="280" r="2"/>
    <circle cx="1200" cy="160" r="2"/>
    <circle cx="1380" cy="320" r="2"/>
    <circle cx="220" cy="540" r="2"/>
    <circle cx="500" cy="660" r="2"/>
    <circle cx="780" cy="500" r="2"/>
    <circle cx="1080" cy="640" r="2"/>
    <circle cx="1320" cy="540" r="2"/>
    <circle cx="320" cy="780" r="2"/>
    <circle cx="640" cy="700" r="2"/>
    <circle cx="900" cy="780" r="2"/>
    <circle cx="1180" cy="720" r="2"/>
  </g>

  <!-- Sparse scatter dots (atmospheric texture) -->
  <g fill="#00ff88" opacity="0.14">
    <circle cx="80" cy="120" r="1.4"/>
    <circle cx="280" cy="80" r="1.4"/>
    <circle cx="540" cy="120" r="1.4"/>
    <circle cx="820" cy="60" r="1.4"/>
    <circle cx="1080" cy="100" r="1.4"/>
    <circle cx="1300" cy="60" r="1.4"/>
    <circle cx="1500" cy="160" r="1.4"/>
    <circle cx="60" cy="380" r="1.4"/>
    <circle cx="60" cy="620" r="1.4"/>
    <circle cx="100" cy="850" r="1.4"/>
    <circle cx="380" cy="850" r="1.4"/>
    <circle cx="700" cy="830" r="1.4"/>
    <circle cx="1100" cy="850" r="1.4"/>
    <circle cx="1450" cy="450" r="1.4"/>
    <circle cx="1520" cy="700" r="1.4"/>
    <circle cx="1500" cy="820" r="1.4"/>
    <circle cx="40" cy="500" r="1.4"/>
    <circle cx="1560" cy="380" r="1.4"/>
    <circle cx="1560" cy="600" r="1.4"/>
    <circle cx="240" cy="450" r="1.2"/>
    <circle cx="560" cy="450" r="1.2"/>
    <circle cx="880" cy="450" r="1.2"/>
    <circle cx="1240" cy="450" r="1.2"/>
  </g>

  <!-- Feature nodes with subtle glow (operator focal points) -->
  <g fill="#00ff88" opacity="0.55">
    <circle cx="680" cy="180" r="3.5" filter="url(#vxHeroGlow)"/>
    <circle cx="500" cy="660" r="3.5" filter="url(#vxHeroGlow)"/>
    <circle cx="1320" cy="540" r="3.5" filter="url(#vxHeroGlow)"/>
  </g>

  <!-- Subtle horizontal scan line (terminal/operator aesthetic) -->
  <g stroke="#00ff88" opacity="0.05" stroke-width="1">
    <line x1="0" y1="442" x2="1600" y2="442"/>
    <line x1="0" y1="443" x2="1600" y2="443" opacity="0.5"/>
  </g>

  <!-- Concentric ring hint at a key node (operator scope motif) -->
  <g stroke="#00ff88" fill="none" opacity="0.08">
    <circle cx="680" cy="180" r="14"/>
    <circle cx="680" cy="180" r="22" opacity="0.5"/>
  </g>
</svg>
